<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Update Biodata</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center font-sans py-10">

    <!-- Login Box -->
    <div id="loginSection" class="bg-white p-8 rounded-2xl shadow-2xl w-96 max-w-full mx-4">
        <div class="text-center mb-6">
            <div class="bg-purple-100 text-purple-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Admin Login</h2>
            <p class="text-xs text-gray-500 mt-1">Username & Password: a raja</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">USERNAME</label>
                <input type="text" id="username" placeholder="Enter username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">PASSWORD</label>
                <input type="password" id="password" placeholder="Enter password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 text-sm">
            </div>
            <p id="errorMsg" class="text-red-500 text-xs hidden text-center">Invalid Username or Password!</p>
            <button onclick="handleLogin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg font-medium transition text-sm shadow-md">
                Login
            </button>
            <div class="text-center mt-3">
                <a href="index.html" class="text-xs text-purple-600 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Website</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Panel & Editor Form (Hidden by default) -->
    <div id="dashboardSection" class="hidden bg-white p-8 rounded-2xl shadow-2xl w-full max-w-3xl mx-4 my-auto">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Admin Dashboard</h2>
                <p class="text-xs text-gray-500">Edit and update index.html contents</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-purple-200 transition">
                    <i class="fa-solid fa-eye mr-1"></i> View Site
                </a>
                <button onclick="handleLogout()" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-200 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>

        <!-- Edit Form -->
        <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-2">
            <h3 class="text-md font-semibold text-purple-700 border-b pb-2">Main Heading & Photo</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Website Title</label>
                    <input type="text" id="inpTitle" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Subtitle</label>
                    <input type="text" id="inpSubtitle" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Full Name</label>
                    <input type="text" id="inpName" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Profession / Title</label>
                    <input type="text" id="inpProfession" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Profile Photo</label>
                    <input type="file" id="inpPhotoFile" accept="image/*" class="w-full px-3 py-1.5 border rounded-lg text-sm file:mr-4 file:py-1 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                </div>
            </div>

            <h3 class="text-md font-semibold text-purple-700 border-b pb-2 pt-2">Personal Information</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Date of Birth</label><input type="text" id="inpDob" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Time of Birth</label><input type="text" id="inpTob" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Place of Birth</label><input type="text" id="inpPob" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Height</label><input type="text" id="inpHeight" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Religion / Caste</label><input type="text" id="inpCaste" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Blood Group</label><input type="text" id="inpBlood" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
            </div>

            <h3 class="text-md font-semibold text-purple-700 border-b pb-2 pt-2">Education & Career</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Qualification</label><input type="text" id="inpEdu" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Job / Profession</label><input type="text" id="inpJob" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Annual Income</label><input type="text" id="inpIncome" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
            </div>

            <h3 class="text-md font-semibold text-purple-700 border-b pb-2 pt-2">Family & Contact Details</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Father's Name</label><input type="text" id="inpFather" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Mother's Name</label><input type="text" id="inpMother" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Siblings</label><input type="text" id="inpSiblings" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                <div><label class="block text-xs font-semibold text-gray-600 mb-1">Phone Number</label><input type="text" id="inpPhone" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
            </div>

            <div class="pt-4">
                <button onclick="saveChanges()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg font-medium transition text-sm shadow-md">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Save All Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Scripting for Login & Data Management -->
    <script>
        const defaultData = {
            title: "Digital Biodata", subtitle: "Marriage / Professional Profile",
            name: "Amrit Raja", profession: "Software Engineer",
            photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80",
            dob: "10 June 2013", tob: "10:30 AM", pob: "New Delhi",
            height: "5 feet 10 inches", caste: "Hindu / Brahmin", blood: "B+",
            edu: "B.Tech in Computer Science", job: "Software Engineer at MNC", income: "12 LPA",
            father: "Mr. Rajesh Sharma (Business)", mother: "Mrs. Sunita Sharma (Homemaker)", siblings: "1 Younger Sister (Studying)",
            phone: "+91 98765 43210"
        };

        function loadFormValues() {
            const data = JSON.parse(localStorage.getItem('biodataContent')) || defaultData;
            document.getElementById('inpTitle').value = data.title;
            document.getElementById('inpSubtitle').value = data.subtitle;
            document.getElementById('inpName').value = data.name;
            document.getElementById('inpProfession').value = data.profession;
            document.getElementById('inpDob').value = data.dob;
            document.getElementById('inpTob').value = data.tob;
            document.getElementById('inpPob').value = data.pob;
            document.getElementById('inpHeight').value = data.height;
            document.getElementById('inpCaste').value = data.caste;
            document.getElementById('inpBlood').value = data.blood;
            document.getElementById('inpEdu').value = data.edu;
            document.getElementById('inpJob').value = data.job;
            document.getElementById('inpIncome').value = data.income;
            document.getElementById('inpFather').value = data.father;
            document.getElementById('inpMother').value = data.mother;
            document.getElementById('inpSiblings').value = data.siblings;
            document.getElementById('inpPhone').value = data.phone;
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === 'a raja' && pass === 'a raja') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadFormValues();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function saveChanges() {
            const fileInput = document.getElementById('inpPhotoFile');
            const existingData = JSON.parse(localStorage.getItem('biodataContent')) || defaultData;

            function saveDataToStorage(photoUrl) {
                const updatedData = {
                    title: document.getElementById('inpTitle').value,
                    subtitle: document.getElementById('inpSubtitle').value,
                    name: document.getElementById('inpName').value,
                    profession: document.getElementById('inpProfession').value,
                    photo: photoUrl || existingData.photo,
                    dob: document.getElementById('inpDob').value,
                    tob: document.getElementById('inpTob').value,
                    pob: document.getElementById('inpPob').value,
                    height: document.getElementById('inpHeight').value,
                    caste: document.getElementById('inpCaste').value,
                    blood: document.getElementById('inpBlood').value,
                    edu: document.getElementById('inpEdu').value,
                    job: document.getElementById('inpJob').value,
                    income: document.getElementById('inpIncome').value,
                    father: document.getElementById('inpFather').value,
                    mother: document.getElementById('inpMother').value,
                    siblings: document.getElementById('inpSiblings').value,
                    phone: document.getElementById('inpPhone').value
                };

                localStorage.setItem('biodataContent', JSON.stringify(updatedData));
                alert('Biodata Updated Successfully! View site to check changes.');
            }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveDataToStorage(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveDataToStorage(existingData.photo);
            }
        }

        function handleLogout() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').classList.add('hidden');
        }
    </script>
</body>
</html>
